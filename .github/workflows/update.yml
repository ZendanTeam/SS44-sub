name: SS44 update

on:
  schedule:
    - cron: "*/30 * * * *"   # هر ۳۰ دقیقه
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch_test.py", ".github/workflows/update.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sing-box (real traffic tester)
        run: |
          TAG=$(curl -s --max-time 30 https://api.github.com/repos/SagerNet/sing-box/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "sing-box $TAG"
          curl -sL --max-time 120 -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${TAG#v}-linux-amd64.tar.gz"
          tar xzf sb.tgz && mv sing-box-*/sing-box ./sing-box && chmod +x sing-box && ./sing-box version
      - run: SINGBOX=./sing-box python3 fetch_test.py
      - run: |
          git config user.name "ss44-bot"
          git config user.email "ss44-bot@users.noreply.github.com"
          git add SS44.txt SS44-gold.txt SS44-udp.txt SS44-base64.txt SS44-clash.yaml STATS.md
          git diff --cached --quiet || git commit -m "update SS44 $(date -u +%Y-%m-%d_%H:%M)"
          git push
